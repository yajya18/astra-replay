[project]
name = "replay-backend"
version = "1.0.0"
description = "Replay: action-aware summarization of first-person task videos (API + pipeline)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.1.0.95",
    "pillow>=13.0.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "reportlab>=5.1.0",
    "scenedetect>=0.7.3",
    "scipy>=1.17.1",
    "sentence-transformers>=6.3.0",
    "sqlmodel>=0.0.50",
    "torch>=2.5",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
asr = [
    "faster-whisper>=1.2.1",
]
providers = [
    "anthropic>=2.12.0",
    "google-genai>=3.6.1",
    "openai>=3.57.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "ASYNC", "PT"]
ignore = ["B008", "RUF001", "RUF002", "RUF003", "PT018"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N806"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
exclude = ["^\\.venv/", "^data/"]

[[tool.mypy.overrides]]
module = ["app.pipeline.*", "app.providers.*"]
strict = true

[[tool.mypy.overrides]]
module = ["scenedetect.*", "sentence_transformers.*", "faster_whisper.*", "reportlab.*", "google.*", "ollama.*", "scipy.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "slow: tests that process real video files with ffmpeg",
  "network: tests that need internet access (skipped by default)",
]
addopts = "-m 'not network'"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
